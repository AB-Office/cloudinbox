name: PR-Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  pr-agent-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR-Agent Review
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # セキュリティレビューを重視した設定
          PR_REVIEWER_EXTRA_INSTRUCTIONS: |
            以下の点を特に重視してレビューを行ってください。レビューは日本語で行ってください。
            
            ## セキュリティレビュー（最重要・最優先）
            
            ### 1. 認証情報・シークレットの漏洩チェック
            - ハードコードされたAPIキー、パスワード、トークン、シークレットがないか徹底的にチェック
            - 環境変数やシークレットマネージャー（Secret Manager、KMS）の適切な使用を確認
            - .envファイル、設定ファイル、コード内への機密情報の混入を検出
            - コミット履歴に機密情報が含まれていないか確認
            
            ### 2. 入力検証とサニタイゼーション
            - すべてのユーザー入力に対して適切な検証が実装されているか
            - SQLインジェクション、XSS、コマンドインジェクション、パストラバーサルの脆弱性
            - ファイルアップロード時の検証（ファイルタイプ、サイズ、内容）
            - 型チェックとバリデーションの実装
            
            ### 3. 認証・認可の実装
            - すべての保護されたリソースに対して認証チェックが実装されているか
            - 権限チェック（認可）の欠如や不備がないか
            - セッション管理の脆弱性（セッション固定、セッションハイジャック対策）
            - トークンの有効期限とリフレッシュの実装
            
            ### 4. 依存関係のセキュリティ
            - 既知の脆弱性（CVE）を持つパッケージの使用がないか
            - 古いバージョンの依存関係の使用
            - 信頼できないパッケージやレジストリの使用
            - package.json、pubspec.yamlの依存関係を確認
            
            ### 5. 暗号化とデータ保護
            - 機密データ（パスワード、トークン、個人情報）の適切な暗号化
            - 平文でのパスワード保存がないか
            - 適切なハッシュアルゴリズム（bcrypt、Argon2等）の使用
            - 暗号化キーの管理方法
            
            ### 6. エラーハンドリングと情報漏洩
            - エラーメッセージからの機密情報漏洩（スタックトレース、内部エラー詳細）
            - スタックトレースの適切な処理（本番環境では非表示）
            - ログへの機密情報（パスワード、トークン、個人情報）の記録がないか
            - 適切なエラーメッセージの実装
            
            ### 7. APIセキュリティ
            - レート制限の実装
            - CORS設定の適切性（過度に緩い設定がないか）
            - API認証の実装（すべてのエンドポイントで認証が必要か）
            - 入力サイズの制限
            
            ### 8. Firebase/Cloud Functions固有のセキュリティ
            - Firestoreセキュリティルールの適切性（読み書き権限の適切な設定）
            - Cloud Functionsの権限設定（最小権限の原則）
            - Storageセキュリティルールの適切性
            - Firebase Authenticationの適切な使用
            
            ### 9. その他のセキュリティ考慮事項
            - タイミング攻撃の可能性
            - リソース制限（DoS攻撃対策）
            - 適切なログ記録と監査
            - セキュリティヘッダーの設定
            
            ## コード品質
            - 型安全性（TypeScript strict mode、Dartの型チェック）
            - エラーハンドリングの適切性
            - テストカバレッジ（特にセキュリティ関連のテスト）
            - コードの可読性と保守性
            - ドキュメントの充実
            
            ## パフォーマンス
            - 不要な処理やループの最適化
            - データベースクエリの効率性（N+1問題等）
            - メモリリークの可能性
            - 非同期処理の適切な実装
            
            ## レビュー形式
            - セキュリティ上の問題が見つかった場合は、優先度（🔴高/🟡中/🟢低）を明確に示してください
            - 各問題について、具体的な修正方法とコード例を提示してください
            - セキュリティ上の問題は、他の問題よりも優先して報告してください
          # 日本語でのレビューを有効化
          PR_REVIEWER_LANGUAGE: ja
          PR_REVIEW_COMMENT_LANGUAGE: ja
          # PR説明の自動生成（日本語）
          PR_DESCRIPTION: true
          PR_DESCRIPTION_LANGUAGE: ja
          # PRタイトルの改善提案（日本語）
          PR_TITLE: true
          PR_TITLE_LANGUAGE: ja
          # コード改善提案を有効化
          PR_CODE_SUGGESTIONS: true
          # ラベルの自動付与
          PR_LABELS: true
          # コメントの自動生成（日本語）
          PR_COMMENTS: true
          PR_COMMENTS_LANGUAGE: ja

