name: Deploy to Firebase

# このワークフローは、mainブランチでタグ（v*形式）がpushされたときに実行されます
# 必要なGitHub Secrets:
#   - FIREBASE_TOKEN: Firebase CLIの認証トークン
#     取得方法:
#       1. ローカル環境でFirebase CLIをインストール（未インストールの場合）:
#          npm install -g firebase-tools
#       2. Firebaseにログイン:
#          firebase login
#       3. CI用のトークンを取得:
#          firebase login:ci
#          このコマンドを実行すると、ブラウザが開いてFirebaseへの認証が求められます。
#          認証が完了すると、ターミナルに長い文字列のトークンが表示されます。
#       4. 取得したトークンをGitHubリポジトリのSecretsに設定:
#          Settings > Secrets and variables > Actions > New repository secret
#          Name: FIREBASE_TOKEN
#          Secret: 取得したトークンの文字列

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            apps/web_app/package-lock.json

      - name: Install Functions dependencies
        run: |
          cd functions
          npm ci

      - name: Build Functions
        run: |
          cd functions
          npm run build

      - name: Install Web App dependencies
        run: |
          cd apps/web_app
          npm ci

      - name: Build Web App
        run: |
          cd apps/web_app
          npm run build
        env:
          MODE: production
          VITE_FIREBASE_ENV: production

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Debug - Check Firebase CLI version and files
        run: |
          firebase --version
          echo "Current directory: $(pwd)"
          echo "Checking firebase.json:"
          cat firebase.json
          echo "Checking storage.rules file:"
          ls -la infra/firebase/storage.rules || echo "storage.rules not found"
          echo "Checking .firebaserc:"
          cat .firebaserc || echo ".firebaserc not found"

      - name: Set Firebase project
        run: firebase use cloudinbox --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy to Firebase
        run: |
          firebase deploy --token ${{ secrets.FIREBASE_TOKEN }} --debug

